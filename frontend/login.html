<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | Fraud Shield</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-body login-page">


    <!-- Theme Toggle -->

    <div class="theme-toggle auth-theme-toggle">

        <button
            id="lightModeBtn"
            class="theme-btn"
            title="Light Mode"
            onclick="setLightMode()">

            ☀

        </button>


        <button
            id="darkModeBtn"
            class="theme-btn"
            title="Dark Mode"
            onclick="setDarkMode()">

            ☾

        </button>

    </div>



    <div class="auth-container">


        <!-- LEFT SIDE -->

        <div class="auth-left">

            <div class="auth-logo">

                🛡️ Fraud Shield

            </div>


            <h1>
                Welcome Back!
            </h1>


            <p>

                Login to your account and monitor
                suspicious transactions with
                Fraud Shield.

            </p>

        </div>



        <!-- LOGIN FORM -->

        <div class="auth-card">

            <h2>
                Login
            </h2>


            <p class="auth-subtitle">
                Enter your account details
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required>

                </div>



                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required>

                </div>



                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox">

                        Remember me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>



                <button
                    type="submit"
                    class="auth-btn">

                    Login

                </button>

            </form>



            <div class="divider">

                <span>OR</span>

            </div>



            <p class="switch-auth">

                Don't have an account?

                <a
                    href="register.html"
                    onclick="event.preventDefault(); slideToPage('register.html', 'register');">

                    Create Account

                </a>

            </p>



            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
